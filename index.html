<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avengers Character Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>AVENGERS CHARACTER SEARCH</h1>
    </header>

    <main>
        <p class="search-label">Search by Full Name or Alias</p>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="e.g. Captain America or Steve Rogers">
            <button id="search-btn">Search</button>
        </div>

        <h2>RESULT</h2>
        <hr>

        <div id="result"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
